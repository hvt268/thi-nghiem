<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vật lý ảo · Phòng thí nghiệm mô phỏng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<meta name="description" content="Phòng thí nghiệm vật lý mô phỏng tương tác: cơ học, nhiệt học, điện và từ, quang học, vật lý hạt nhân.">
<meta property="og:type" content="website">
<meta property="og:title" content="Vật lý ảo · Phòng thí nghiệm mô phỏng">
<meta property="og:description" content="Khám phá vật lý bằng các thí nghiệm mô phỏng tương tác.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%231d4ed8'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2'%3E%3Cellipse cx='20' cy='20' rx='12' ry='4.6'/%3E%3Cellipse cx='20' cy='20' rx='12' ry='4.6' transform='rotate(60 20 20)'/%3E%3Cellipse cx='20' cy='20' rx='12' ry='4.6' transform='rotate(120 20 20)'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='2.6' fill='white'/%3E%3C/svg%3E">
<!-- SỐ PHIÊN BẢN CỦA TRANG: tăng số này mỗi lần cập nhật css/js/data để người dùng tải bản mới (đây là nơi duy nhất) -->
<script>
window.SITE_V='2026.11.17.5';
document.write('<link rel="stylesheet" href="css/trang-chu.css?v='+SITE_V+'">');
</script>

</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Danh mục chủ đề">
    <a class="brand" href="#/" aria-label="Về trang chủ">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="var(--accent)"/>
        <g fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round">
          <ellipse cx="20" cy="20" rx="12" ry="4.6"/>
          <ellipse cx="20" cy="20" rx="12" ry="4.6" transform="rotate(60 20 20)"/>
          <ellipse cx="20" cy="20" rx="12" ry="4.6" transform="rotate(120 20 20)"/>
        </g>
        <circle cx="20" cy="20" r="2.6" fill="var(--on-accent)"/>
      </svg>
      <div><b>Vật lý ảo</b><span>Phòng thí nghiệm mô phỏng</span></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở danh mục chủ đề" aria-controls="side">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm thí nghiệm, ví dụ: con lắc, thấu kính…" autocomplete="off" aria-label="Tìm thí nghiệm">
      </label>
      <div class="stats top-stats" id="topStats"></div>
      <span class="spacer"></span>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>
      </button>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<noscript><p style="padding:24px">Trang này cần bật JavaScript để hiển thị các thí nghiệm.</p></noscript>
<script>
/* Nạp lần lượt các file, gắn ?v=… để tránh trình duyệt dùng bản cũ */
['data/danh-muc.js','data/hinh-dai-dien.js','js/ung-dung.js'].forEach(function(f){
  var e=document.createElement('script');e.src=f+'?v='+window.SITE_V;e.async=false;document.body.appendChild(e);
});
</script>
</body>
</html>
